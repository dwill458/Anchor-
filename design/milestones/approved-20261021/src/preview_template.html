<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anchor Milestone Reveal Showcase</title>
<style>
  :root{--ink:#121B22;--ink2:#1d2040;--cream:#F4EDE0;--gold:#C9A24A;--goldHi:#E6C877;--mute:#8d90a8;--line:rgba(244,237,224,.12)}
  *{box-sizing:border-box}
  html,body{margin:0;background:#0d0f1f;color:var(--cream);font:14px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
  .serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
  .app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
  aside{border-right:1px solid var(--line);padding:18px 14px;overflow:auto;max-height:100vh;position:sticky;top:0}
  aside h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 4px;color:var(--goldHi);font-weight:600}
  aside p{margin:0 0 14px;color:var(--mute);font-size:12px}
  .cat{margin:16px 0 6px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
  .item{display:flex;gap:10px;align-items:center;width:100%;background:none;border:1px solid transparent;color:inherit;padding:6px 8px;border-radius:10px;cursor:pointer;text-align:left}
  .item:hover{background:rgba(255,255,255,.04)}
  .item[aria-current=true]{background:rgba(201,162,74,.1);border-color:rgba(201,162,74,.45)}
  .item img{width:44px;height:44px;flex:none}
  .item b{display:block;font-weight:600}.item small{color:var(--mute)}
  main{padding:22px 28px;display:flex;flex-direction:column;gap:18px;min-width:0}
  .stagewrap{display:grid;grid-template-columns:minmax(300px,520px) 1fr;gap:28px;align-items:start}
  .stage{position:relative;aspect-ratio:3/4;border-radius:28px;background:radial-gradient(120% 90% at 50% 30%,#1C2A33 0%,#121B22 55%,#0b0c1a 100%);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden}
  .stage.cream{background:#F4EDE0;color:#121B22}
  .stage .eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--goldHi);opacity:.9}
  .stage.cream .eyebrow{color:#8F6F22}
  .stage .emb{width:min(72%,340px);aspect-ratio:1}
  .stage .emb svg{width:100%;height:100%;display:block;overflow:visible}
  .stage h2{margin:6px 0 0;font-weight:500;font-size:30px}
  .stage .req{color:var(--mute);font-size:13px}
  .badge{position:absolute;top:14px;right:14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);padding:3px 9px;border-radius:99px;color:var(--mute)}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  button.b{background:rgba(255,255,255,.05);border:1px solid var(--line);color:inherit;padding:8px 14px;border-radius:10px;cursor:pointer;font:inherit}
  button.b:hover{background:rgba(255,255,255,.1)}
  button.p{background:var(--gold);color:#121B22;border-color:var(--gold);font-weight:600}
  button.on{outline:1px solid var(--goldHi)}
  label.c{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:13px}
  select,input[type=range]{accent-color:var(--gold);background:#1a1c36;color:inherit;border:1px solid var(--line);border-radius:8px;padding:5px 6px}
  .panel{border:1px solid var(--line);border-radius:16px;padding:16px 18px;background:rgba(255,255,255,.02)}
  .panel h3{margin:0 0 8px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--goldHi);font-weight:600}
  .tl{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;align-items:center;font-size:12px;color:var(--mute)}
  .bar{position:relative;height:10px;background:rgba(255,255,255,.05);border-radius:5px}
  .bar i{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#8F6F22,#E6C877);border-radius:5px;opacity:.85}
  .head{position:relative}
  .playhead{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--cream);opacity:.7;pointer-events:none}
  .tiles{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
  .tiles figure{margin:0;text-align:center;color:var(--mute);font-size:11px}
  .tilebg{display:flex;gap:10px;padding:12px;border-radius:16px;background:#F4EDE0}
  .tilebg.dark{background:#121B22}
  kbd{background:#1a1c36;border:1px solid var(--line);padding:1px 6px;border-radius:5px;font-size:11px}
  @media (max-width:900px){.app{grid-template-columns:1fr}aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}.stagewrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Anchor Milestones</h1>
    <p>20 emblems · reveal showcase<br>Design reference, not the app implementation.</p>
    <div id="list"></div>
  </aside>
  <main>
    <div class="stagewrap">
      <div>
        <div class="stage" id="stage">
          <span class="badge" id="badge">earned</span>
          <div class="eyebrow" id="eyebrow">Replay · Commitment</div>
          <div class="emb" id="emb"></div>
          <h2 class="serif" id="title">Name</h2>
          <div class="req" id="req"></div>
        </div>
        <div class="controls" style="margin-top:12px">
          <button class="b p" id="play">▶ Play reveal</button>
          <button class="b" id="final">Earned</button>
          <button class="b" id="locked">Locked</button>
          <button class="b" id="all">Play all 20</button>
        </div>
        <div class="controls" style="margin-top:10px">
          <label class="c">Speed <select id="speed"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
          <label class="c"><input type="checkbox" id="rm"> Reduced motion</label>
          <label class="c"><input type="checkbox" id="bg"> Cream stage</label>
        </div>
        <div class="controls" style="margin-top:10px">
          <label class="c" style="flex:1">Scrub <input type="range" id="scrub" min="0" max="1000" value="1000" style="flex:1"></label>
          <span class="req" id="clock" style="min-width:90px;text-align:right;color:var(--mute)">0.00 s</span>
        </div>
        <p style="color:var(--mute);font-size:12px;margin:8px 0 0"><kbd>Space</kbd> replay · <kbd>←</kbd><kbd>→</kbd> previous / next</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
        <div class="panel"><h3 id="famTitle">Motion family</h3><div id="famInfo" style="color:var(--mute);margin-bottom:10px"></div>
          <div class="head"><div class="tl" id="timeline"></div><div class="playhead" id="playhead" style="left:140px"></div></div>
        </div>
        <div class="panel"><h3>Gallery-size check</h3>
          <div class="tiles" id="tiles"></div>
        </div>
        <div class="panel"><h3>Reduced motion</h3><div id="rmInfo" style="color:var(--mute)"></div></div>
      </div>
    </div>
  </main>
</div>
<script>
const SPEC = __SPEC__;
const SVGS = __SVGS__;
const META = __META__;
const $ = s => document.querySelector(s);
const ease = n => { const b = SPEC.easings[n] || SPEC.easings.outCubic; return `cubic-bezier(${b.join(',')})`; };
const uri = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
let cur = META[0], anims = [], extras = [], maxEnd = 0, state = 'final', allRun = false, token = 0;

function stepsFor(slug, family) {
  const fam = SPEC.families[family]; const pm = (fam.perMilestone || {})[slug] || {};
  let steps = fam.steps.map(s => ({ ...s }));
  steps.forEach(s => { for (const k in s) if (typeof s[k] === 'string' && s[k][0] === '$') s[k] = pm[s[k].slice(1)]; });
  steps = steps.filter(s => !s.only || s.only.includes(slug));
  if (pm.replace) steps.forEach(s => { if (pm.replace[s.name]) Object.assign(s, pm.replace[s.name]); });
  if (pm.extra) steps.push(...pm.extra.map(e => ({ ...e })));
  return steps;
}

function clearAnims() {
  anims.forEach(a => { try { a.cancel(); } catch (e) {} });
  anims = [];
  extras.forEach(e => e.remove()); extras = [];
  const svg = $('#emb svg'); if (svg) svg.querySelectorAll('*').forEach(e => { e.style.transformBox = ''; e.style.transformOrigin = ''; });
}

function mount(mode) {
  clearAnims();
  $('#emb').innerHTML = SVGS[cur.slug][mode];
  $('#badge').textContent = mode;
  state = mode;
}

function finalOpacity(el) { const o = el.getAttribute('opacity'); return o === null ? 1 : parseFloat(o); }
function isFilled(el) { const f = el.getAttribute('fill'); return el.tagName === 'g' || (f && f !== 'none'); }

function elementsFor(svg, slug, s) {
  if (s.layerGroup) return [svg.querySelector('#' + slug + '__' + s.layerGroup)];
  const g = svg.querySelector('#' + slug + '__' + s.layer); if (!g) return [];
  let els = [...g.children];
  if (s.match) els = els.filter(e => new RegExp(s.match).test(e.id));
  if (s.exclude) els = els.filter(e => !new RegExp(s.exclude).test(e.id));
  return els;
}

function build() {
  const svg = $('#emb svg'), slug = cur.slug, fam = cur.family;
  const steps = stepsFor(slug, fam);
  const total = SPEC.families[fam].duration;
  const A = []; let mx = 0;
  const add = (el, kf, delay, dur, easeName) => {
    const a = el.animate(kf, { delay, duration: dur, easing: ease(easeName), fill: 'both' });
    a.pause(); A.push(a); mx = Math.max(mx, delay + dur);
  };
  for (const s of steps) {
    if (s.op === 'pulse') {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', 128); c.setAttribute('cy', 128); c.setAttribute('r', s.r0); c.setAttribute('fill', 'none');
      c.setAttribute('stroke', '#E6C877'); c.setAttribute('stroke-width', 2.2); c.setAttribute('id', 'fx-pulse'); c.setAttribute('opacity', 0);
      svg.appendChild(c); extras.push(c);
      add(c, [{ r: s.r0 + 'px', opacity: 0, offset: 0 }, { opacity: .7, offset: .18 }, { r: s.r1 + 'px', opacity: 0, offset: 1 }], s.start, s.dur, s.ease);
      continue;
    }
    const els = elementsFor(svg, slug, s); const n = els.length;
    if (!n) continue;
    let stag = s.stagger || 0; if (s.maxSpread && n > 1) stag = Math.min(stag, s.maxSpread / (n - 1));
    els.forEach((el, i) => {
      let delay = s.start;
      if (s.idIndex) { const m = el.id.match(new RegExp(s.idIndex)); delay += ((m ? parseInt(m[1]) : 1) - 1) * stag; } else delay += i * stag;
      const fo = finalOpacity(el), dur = s.dur || 0;
      let op = s.op;
      if (op === 'draw' && (isFilled(el) || el.hasAttribute('stroke-dasharray'))) op = 'fade';
      if (op === 'draw') {
        el.setAttribute('pathLength', '1');
        add(el, [{ strokeDasharray: '1 1', strokeDashoffset: '1', opacity: 0, offset: 0 }, { opacity: fo, offset: .05 }, { strokeDasharray: '1 1', strokeDashoffset: '0', opacity: fo, offset: 1 }], delay, dur, s.ease);
      } else if (op === 'fade') {
        add(el, [{ opacity: s.from ?? 0 }, { opacity: fo }], delay, dur, s.ease);
      } else if (op === 'fadeKeys') {
        const T = s.keys[s.keys.length - 1][0];
        add(el, s.keys.map(k => ({ opacity: k[1] * fo, offset: k[0] / T })), delay, T, s.ease);
      } else if (op === 'pop') {
        el.style.transformBox = 'fill-box'; el.style.transformOrigin = 'center';
        const from = s.from ?? 0.5;
        add(el, [{ opacity: from > 1 ? 0 : 0, transform: `scale(${from})` }, { opacity: fo, transform: 'scale(1)' }], delay, dur, s.ease);
      } else if (op === 'radial') {
        el.style.transformBox = 'view-box'; el.style.transformOrigin = '128px 128px';
        add(el, [{ opacity: 0, transform: `scale(${s.from})` }, { opacity: fo, transform: 'scale(1)' }], delay, dur, s.ease);
      } else if (op === 'raise') {
        el.style.transformBox = 'fill-box'; el.style.transformOrigin = '0% 100%';
        add(el, [{ opacity: 0, transform: 'scaleY(0.05)' }, { opacity: fo, transform: 'scaleY(1)' }], delay, dur, s.ease);
      } else if (op === 'translateX') {
        add(el, [{ opacity: 0, transform: `translateX(${s.from}px)` }, { opacity: fo, transform: 'translateX(0)' }], delay, dur, s.ease);
      } else if (op === 'strokewidth') {
        const sw = parseFloat(el.getAttribute('stroke-width'));
        add(el, [{ strokeWidth: s.from + 'px' }, { strokeWidth: sw + 'px' }], delay, dur, s.ease);
      } else if (op === 'layerScale') {
        el.style.transformBox = 'view-box'; el.style.transformOrigin = '128px 128px';
        add(el, s.keys.map((k, j) => ({ transform: `scale(${k})`, offset: j / (s.keys.length - 1) })), delay, dur, s.ease);
      }
    });
  }
  anims = A; maxEnd = Math.max(mx, total);
  return A;
}

function setRate() { const r = parseFloat($('#speed').value); anims.forEach(a => a.playbackRate = r); }

async function play() {
  const my = ++token;
  mount('earned');
  $('#eyebrow').textContent = 'Replay · ' + cur.category;
  state = 'playing';
  if ($('#rm').checked) {
    const lk = document.createElement('div');
    lk.style.cssText = 'position:absolute;inset:0;pointer-events:none';
    lk.innerHTML = SVGS[cur.slug].locked; lk.firstElementChild.style.cssText = 'width:100%;height:100%;display:block;overflow:visible';
    $('#emb').style.position = 'relative'; $('#emb').appendChild(lk);
    const a = lk.animate([{ opacity: 1 }, { opacity: 0 }], { duration: SPEC.reducedMotion.duration, easing: ease(SPEC.reducedMotion.ease), fill: 'forwards' });
    const b = $('#emb svg').animate([{ opacity: 0 }, { opacity: 1 }], { duration: SPEC.reducedMotion.duration, easing: ease(SPEC.reducedMotion.ease), fill: 'both' });
    extras.push(lk); anims.push(a, b); maxEnd = SPEC.reducedMotion.duration;
    await Promise.all([a.finished, b.finished]).catch(() => {}); state = 'done'; return;
  }
  build(); setRate();
  anims.forEach(a => a.currentTime = 0);
  anims.forEach(a => a.play());
  drawHead(true);
  try { await Promise.all(anims.map(a => a.finished)); } catch (e) { return; }
  if (my === token) { state = 'done'; drawHead(false); $('#scrub').value = 1000; $('#clock').textContent = (maxEnd / 1000).toFixed(2) + ' s'; movePlayhead(maxEnd); }
}

function drawHead(on) {
  if (!on) return;
  const tick = () => {
    if (state !== 'playing' || !anims.length) return;
    const t = Math.min(maxEnd, anims[0].currentTime ?? 0);
    $('#clock').textContent = (t / 1000).toFixed(2) + ' s';
    $('#scrub').value = Math.round(t / maxEnd * 1000);
    movePlayhead(t);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function movePlayhead(t) { const w = $('#timeline').getBoundingClientRect().width - 140; $('#playhead').style.left = (140 + w * Math.min(1, t / maxEnd)) + 'px'; }

$('#scrub').addEventListener('input', e => {
  if (state === 'locked') return;
  if (state !== 'paused' && state !== 'playing') { mount('earned'); build(); }
  state = 'paused'; anims.forEach(a => { a.pause(); });
  const t = parseInt(e.target.value) / 1000 * maxEnd;
  anims.forEach(a => a.currentTime = t);
  $('#clock').textContent = (t / 1000).toFixed(2) + ' s'; movePlayhead(t);
});

function showFinal() { token++; mount('earned'); $('#eyebrow').textContent = 'Earned · ' + cur.category; $('#clock').textContent = ''; }
function showLocked() { token++; mount('locked'); $('#eyebrow').textContent = 'Locked · ' + cur.category; }

function renderTimeline() {
  const fam = SPEC.families[cur.family]; const steps = stepsFor(cur.slug, cur.family);
  $('#famTitle').textContent = cur.category + ' — ' + fam.title;
  $('#famInfo').textContent = fam.emotion + ' · ' + (fam.duration / 1000).toFixed(1) + ' s then hold on the earned art';
  const tot = fam.duration;
  $('#timeline').innerHTML = steps.map(s => {
    const st = typeof s.start === 'number' ? s.start : 0;
    const spread = (s.maxSpread || (s.stagger ? s.stagger * 6 : 0));
    const dur = Math.min(tot - st, (s.dur || (s.keys ? s.keys[s.keys.length - 1][0] : 600)) + spread);
    return `<div>${s.name}</div><div class="bar"><i style="left:${st / tot * 100}%;width:${Math.max(1.5, dur / tot * 100)}%"></i></div>`;
  }).join('');
  $('#rmInfo').textContent = SPEC.reducedMotion.treatment + ' ' + SPEC.reducedMotion.keep;
}

function renderTiles() {
  const e = uri(SVGS[cur.slug].earned), l = uri(SVGS[cur.slug].locked);
  const mk = (src, px) => `<img src="${src}" width="${px}" height="${px}" alt="">`;
  $('#tiles').innerHTML = [['Cream · 96 px', ''], ['Dark · 96 px', 'dark']].map(([cap, cls]) =>
    `<figure><div class="tilebg ${cls}">${mk(l, 96)}${mk(e, 96)}</div>${cap} · locked / earned</figure>`).join('') +
    `<figure><div class="tilebg">${mk(l, 64)}${mk(e, 64)}${mk(l, 44)}${mk(e, 44)}</div>64 and 44 px</figure>`;
}

function select(slug, autoplay = true) {
  cur = META.find(m => m.slug === slug);
  document.querySelectorAll('.item').forEach(b => b.setAttribute('aria-current', b.dataset.slug === slug));
  $('#title').textContent = cur.name; $('#req').textContent = cur.req;
  renderTimeline(); renderTiles(); showFinal();
  if (autoplay) play();
}

function buildList() {
  const cats = ['Strength', 'Commitment', 'Journey', 'Vision']; let h = '';
  for (const c of cats) {
    h += `<div class="cat">${c}</div>`;
    META.filter(m => m.category === c).forEach(m => {
      h += `<button class="item" data-slug="${m.slug}"><img src="${uri(SVGS[m.slug].earned)}" alt=""><span><b class="serif">${m.name}</b><small>${m.req}</small></span></button>`;
    });
  }
  $('#list').innerHTML = h;
  $('#list').addEventListener('click', e => { const b = e.target.closest('.item'); if (b) { allRun = false; select(b.dataset.slug); } });
}

$('#play').onclick = () => { allRun = false; play(); };
$('#final').onclick = () => { allRun = false; showFinal(); };
$('#locked').onclick = () => { allRun = false; showLocked(); };
$('#speed').onchange = setRate;
$('#bg').onchange = e => $('#stage').classList.toggle('cream', e.target.checked);
$('#all').onclick = async () => {
  allRun = true;
  for (const m of META) { if (!allRun) break; select(m.slug, false); await play(); await new Promise(r => setTimeout(r, 700)); }
  allRun = false;
};
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const i = META.findIndex(m => m.slug === cur.slug);
  if (e.code === 'Space') { e.preventDefault(); play(); }
  if (e.key === 'ArrowRight') select(META[(i + 1) % META.length].slug);
  if (e.key === 'ArrowLeft') select(META[(i - 1 + META.length) % META.length].slug);
});

buildList();
select(META[0].slug, false);
// QA hooks (design verification only)
window.__ui = {
  META, select: (s, a = false) => select(s, a), play, showFinal, showLocked,
  done: () => new Promise(r => { const t = () => (state === 'done' || state === 'final') ? r(state) : setTimeout(t, 50); t(); }),
  cancelAnimations: () => clearAnims(), duration: () => maxEnd, state: () => state, animCount: () => anims.length,
};
</script>
</body>
</html>
