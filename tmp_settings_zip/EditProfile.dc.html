<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
.p{width:390px;background:#F4F0E8;color:#14162B;font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.3}
.hd{display:flex;align-items:center;gap:4px;padding:12px 12px 8px}
.bk{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#14162B;border-radius:22px;text-decoration:none}
.g{margin:0 16px;background:#FBF9F4;border:1px solid #E4DDD0;border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;min-height:66px;color:#14162B}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t{font-weight:600;font-size:16px}
.s{font-size:14px;color:#655F54;line-height:1.4}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sw{position:relative;width:52px;height:32px;border-radius:16px;border:2px solid #8A8272;background:#EFE9DC;flex:none;padding:0;cursor:pointer}
.sw::before{content:'';position:absolute;inset:-8px -4px}
.sw .kn{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:12px;background:#8A8272}
.btn{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:16px;background:#14162B;color:#F4F0E8;font:600 16px 'Inter',system-ui,sans-serif;border:0;cursor:pointer;width:100%}
</style>
</helmet>
<div class="p" style="height:760px;overflow:hidden">

<div class="hd">
<a class="bk" href="Main.dc.html" aria-label="Back to settings"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
<h1 style="margin:0;font-size:22px;font-weight:600">Edit profile</h1>
</div>

<div style="display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:16px">
<div style="position:relative;width:96px;height:96px;border-radius:48px;background:#14162B;color:#F4F0E8;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:600">D
<span style="position:absolute;right:-2px;bottom:-2px;width:32px;height:32px;border-radius:16px;background:#F3E9C8;border:2px solid #F4F0E8;color:#7A5A0C;display:flex;align-items:center;justify-content:center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4"/></svg></span>
</div>
<button style="min-height:48px;padding:0 20px;background:none;border:0;font:600 16px 'Inter',system-ui,sans-serif;color:#14162B;cursor:pointer">Change photo</button>
</div>

<div style="margin:12px 16px 0">
<div style="display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 8px">
<label for="dn" style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#655F54">Display name</label>
<span class="s">17/24</span>
</div>
<input id="dn" type="text" value="Deontrez Williams" style="width:100%;height:56px;border-radius:16px;border:1.5px solid #B3AA97;background:#FBF9F4;padding:0 16px;font:600 17px 'Inter',system-ui,sans-serif;color:#14162B">
<p class="s" style="margin:8px 4px 0">Shown in your reflections and at the top of your profile.</p>
</div>

<div style="margin:28px 20px 8px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#655F54">Vision</div>
<div class="g">
<div class="row">
<span class="tx"><span class="t">Use my photo in Vision</span><span class="s">Make your profile photo available as an image for your vision board.</span></span>
<button class="sw" role="switch" aria-checked="false" aria-label="Use my profile photo in Vision"><span class="kn"></span></button>
</div>
</div>
<p class="s" style="margin:8px 20px 0">Add a profile photo first to turn this on.</p>

<div style="margin:28px 16px 0"><button class="btn">Save changes</button></div>

</div>
</x-dc>

</body>
</html>
