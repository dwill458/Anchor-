<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session defaults</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
.p{width:390px;background:#F4F0E8;color:#14162B;font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.3}
.hd{display:flex;align-items:center;gap:4px;padding:12px 12px 8px}
.bk{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#14162B;border-radius:22px;text-decoration:none}
.gl{margin:28px 20px 8px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#655F54}
.g{margin:0 16px;background:#FBF9F4;border:1px solid #E4DDD0;border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;min-height:66px;color:#14162B;border-top:1px solid #E4DDD0}
.g>.row:first-child{border-top:0}
.row.on{background:#F7F0DA}
.row.p0{padding:0 16px 0 0}
.sel{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:12px 0 12px 16px;min-height:72px;background:none;border:0;font:inherit;color:#14162B;text-align:left;cursor:pointer}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t{font-weight:600;font-size:16px}
.s{font-size:14px;color:#655F54}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.segwrap{margin:0 16px;display:flex;gap:8px}
.sb{flex:1;min-height:52px;border-radius:14px;border:1.5px solid #B3AA97;background:#FBF9F4;font:600 15px 'Inter',system-ui,sans-serif;color:#14162B;cursor:pointer;padding:0 8px}
.sb.on{border:2px solid #14162B;background:#F3E9C8}
.rd{width:24px;height:24px;border-radius:12px;border:2px solid #8A8272;flex:none;display:flex;align-items:center;justify-content:center}
.rd.on{border-color:#14162B}
.rd.on::after{content:'';width:12px;height:12px;border-radius:6px;background:#14162B}
.pv{width:44px;height:44px;border-radius:22px;border:1.5px solid #B3AA97;background:#FBF9F4;color:#14162B;display:flex;align-items:center;justify-content:center;flex:none;padding:0;cursor:pointer}
.note{margin:12px 20px 0;font-size:14px;color:#655F54;line-height:1.4}
</style>
</helmet>
<div class="p" style="height:1000px;overflow:hidden">

<div class="hd">
<a class="bk" href="Practice.dc.html" aria-label="Back to Practice"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
<h1 style="margin:0;font-size:22px;font-weight:600">Session defaults</h1>
</div>

<div class="segwrap" role="tablist" aria-label="Practice mode" style="margin-top:12px">
<button class="sb on" role="tab" aria-selected="true">Focus</button>
<button class="sb" role="tab" aria-selected="false">[Mode 2]</button>
<button class="sb" role="tab" aria-selected="false">[Mode 3]</button>
</div>
<p class="note" style="margin-top:10px">You're editing defaults for <b style="color:#14162B">Focus</b>. Each mode keeps its own.</p>

<div class="gl" style="margin-top:20px">Duration</div>
<div class="segwrap" role="radiogroup" aria-label="Duration">
<button class="sb" role="radio" aria-checked="false">10 sec</button>
<button class="sb on" role="radio" aria-checked="true">30 sec</button>
<button class="sb" role="radio" aria-checked="false">1 min</button>
</div>

<div class="gl">Guidance voice</div>
<div class="g" role="radiogroup" aria-label="Guidance voice">
<div class="row p0">
<button class="sel" role="radio" aria-checked="false"><span class="rd"></span><span class="tx"><span class="t">Grounded</span><span class="s">Steady and measured</span></span></button>
<button class="pv" aria-label="Preview Grounded"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7V5z"/></svg></button>
</div>
<div class="row p0 on">
<button class="sel" role="radio" aria-checked="true"><span class="rd on"></span><span class="tx"><span class="t">Serene</span><span class="s">Gentle and reflective</span></span></button>
<button class="pv" aria-label="Preview Serene"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7V5z"/></svg></button>
</div>
<div class="row p0">
<button class="sel" role="radio" aria-checked="false"><span class="rd"></span><span class="tx"><span class="t">Warm</span><span class="s">Friendly, like a guide beside you</span></span></button>
<button class="pv" aria-label="Preview Warm"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7V5z"/></svg></button>
</div>
<div class="row p0">
<button class="sel" role="radio" aria-checked="false"><span class="rd"></span><span class="tx"><span class="t">Soothing</span><span class="s">Slow and softly paced</span></span></button>
<button class="pv" aria-label="Preview Soothing"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7V5z"/></svg></button>
</div>
<div class="row p0">
<button class="sel" role="radio" aria-checked="false"><span class="rd"></span><span class="tx"><span class="t">No guidance</span><span class="s">No spoken instruction</span></span></button>
</div>
</div>

<div class="gl">Background audio</div>
<div class="segwrap" role="radiogroup" aria-label="Background audio">
<button class="sb on" role="radio" aria-checked="true">Ambient</button>
<button class="sb" role="radio" aria-checked="false">Silence</button>
</div>

<div style="display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:24px">
<span class="s">Changes save automatically.</span>
<button style="min-height:48px;padding:0 20px;background:none;border:0;font:600 15px 'Inter',system-ui,sans-serif;color:#7A5A0C;cursor:pointer">Reset Focus to original defaults</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
