<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sound and feel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
.p{width:390px;background:#F4F0E8;color:#14162B;font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.3}
.hd{display:flex;align-items:center;gap:4px;padding:12px 12px 8px}
.bk{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#14162B;border-radius:22px;text-decoration:none}
.gl{margin:28px 20px 8px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#655F54}
.g{margin:0 16px;background:#FBF9F4;border:1px solid #E4DDD0;border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;min-height:66px;color:#14162B}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t{font-weight:600;font-size:16px}
.s{font-size:14px;color:#655F54;line-height:1.4}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sw{position:relative;width:52px;height:32px;border-radius:16px;border:2px solid #14162B;background:#14162B;flex:none;padding:0;cursor:pointer}
.sw::before{content:'';position:absolute;inset:-8px -4px}
.sw .kn{position:absolute;top:2px;left:22px;width:24px;height:24px;border-radius:12px;background:#FBF9F4}
.seg{display:flex;gap:8px;padding:12px 16px 8px}
.sb{flex:1;min-height:48px;border-radius:14px;border:1.5px solid #B3AA97;background:#FBF9F4;font:600 15px 'Inter',system-ui,sans-serif;color:#14162B;cursor:pointer;padding:0 6px}
.sb.on{border:2px solid #14162B;background:#F3E9C8}
</style>
</helmet>
<div class="p" style="height:720px;overflow:hidden">

<div class="hd">
<a class="bk" href="Main.dc.html" aria-label="Back to settings"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
<h1 style="margin:0;font-size:22px;font-weight:600">Sound &amp; feel</h1>
</div>

<div class="gl" style="margin-top:12px">Haptics</div>
<div class="g">
<div class="seg" role="radiogroup" aria-label="Haptic feedback">
<button class="sb on" role="radio" aria-checked="true">Strong</button>
<button class="sb" role="radio" aria-checked="false">Standard</button>
<button class="sb" role="radio" aria-checked="false">Soft</button>
</div>
<div style="padding:4px 16px 16px" class="s">Prominent, tactile pulses.</div>
</div>

<div class="gl">Sound</div>
<div class="g">
<div class="row">
<span class="tx"><span class="t">Sound effects</span><span class="s">Interface and practice sounds</span></span>
<button class="sw" role="switch" aria-checked="true" aria-label="Sound effects"><span class="kn"></span></button>
</div>
</div>

<div class="gl">Motion</div>
<div class="g">
<div class="seg" role="radiogroup" aria-label="Motion">
<button class="sb on" role="radio" aria-checked="true">Match device</button>
<button class="sb" role="radio" aria-checked="false">Reduced</button>
<button class="sb" role="radio" aria-checked="false">Full</button>
</div>
<div style="padding:4px 16px 16px" class="s">Follows your phone's Reduce Motion setting.</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":720}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
