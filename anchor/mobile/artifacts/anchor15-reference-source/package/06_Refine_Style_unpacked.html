<style>/* ============================================================================
   Anchor — Refine Expression (Embellish)
   Unified with the Sanctuary / Practice / Anchor Detail / Profile system:
   near-black void, muted gilt accent, hairline dividers, Cinzel + EB Garamond.
   ============================================================================ */

:root {
  --navy: #0F1419; --midnight: #0B1015; --steel: #18222B; --harbor: #1E2A33;
  --gold: #D9B36C; --gold-bright: #F2DFA8;
  --bone: #F4EFE6; --ash: #87939D;
  --hairline: rgba(217,179,108,0.12); --hairline-strong: rgba(217,179,108,0.34);
  --slack: rgba(135,147,157,0.26);
  --serif: 'Cinzel', serif; --voice: 'EB Garamond', serif; --sans: 'Inter', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: #080B0F; font-family: var(--sans); -webkit-font-smoothing: antialiased; }
#root { width: 100%; height: 100%; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
a { color: var(--gold); text-decoration: none; }
a:hover { color: var(--gold-bright); }

.stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #080B0F; padding: 16px; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; color: var(--bone); overflow: hidden; background: var(--navy); }

/* ── AMBIENT FIELD ─────────────────────────────────────────────────────── */
.r-bg { position: absolute; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
.r-bg-base { position: absolute; inset: 0; background: linear-gradient(180deg, #18202A 0%, #121820 44%, var(--navy) 100%); }
.r-bg-glow { position: absolute; top: -140px; left: -90px; width: 400px; height: 400px; border-radius: 50%;
  background: radial-gradient(circle, rgba(217,179,108,0.075) 0%, transparent 66%); }
.r-grain { position: absolute; inset: 0; opacity: 0.5;
  background-image: radial-gradient(rgba(244,239,230,0.035) 0.5px, transparent 0.5px); background-size: 3px 3px; }

@keyframes r-breathe { 0%,100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.02); opacity: 1; } }
@keyframes r-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
.r-crest { animation: r-breathe 5500ms ease-in-out infinite; }
@keyframes r-fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.r-anim { animation: r-fade-up 0.5s ease-out both; }
@media (prefers-reduced-motion: reduce) { .r-crest, .r-anim { animation: none; } }

/* ── TOP BAR ───────────────────────────────────────────────────────────── */
.r-top { position: relative; z-index: 6; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
  height: 44px; padding: 46px 22px 0; }
.r-back { display: flex; align-items: center; gap: 7px; height: 44px; color: var(--ash); }
.r-back:hover { color: var(--bone); }
.r-back span { font-family: var(--sans); font-size: 13px; }
.r-top-dots { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; gap: 4px; }
.r-top-dots span { width: 3px; height: 3px; border-radius: 50%; background: var(--ash); }

/* ── SCROLL BODY ───────────────────────────────────────────────────────── */
.r-scroll { flex: 1; position: relative; z-index: 5; overflow-y: auto; scrollbar-width: none; padding: 18px 0 152px; }
.r-scroll::-webkit-scrollbar { display: none; }

.r-header { padding: 0 22px 4px; }
.r-eyebrow { font-family: var(--serif); font-size: 11px; font-weight: 500; letter-spacing: 0.20em; color: var(--ash); text-transform: uppercase; }
.r-title { font-family: var(--serif); font-size: 28px; font-weight: 600; color: var(--bone); letter-spacing: 0.01em; line-height: 1.1; margin-top: 8px; }
.r-lead { font-family: var(--voice); font-style: italic; font-size: 17px; color: rgba(244,239,230,0.68); line-height: 1.4; margin-top: 10px; text-wrap: pretty; max-width: 320px; }
.r-principle { font-family: var(--sans); font-weight: 300; font-size: 13px; color: rgba(135,147,157,0.9); line-height: 1.5; margin-top: 10px; text-wrap: pretty; max-width: 320px; }
.r-microline { margin-top: 18px; font-family: var(--serif); font-size: 10.5px; font-weight: 600; letter-spacing: 0.15em; color: var(--gold); text-transform: uppercase; }

/* ── SECTION HEADERS ───────────────────────────────────────────────────── */
.r-sec { margin-top: 32px; }
.r-sec-hd { padding: 0 22px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.r-sec-title { font-family: var(--serif); font-size: 15px; font-weight: 600; color: var(--bone); letter-spacing: 0.10em; text-transform: uppercase; }
.r-sec-title--seasonal { color: var(--gold-bright); }
.r-sec-meta { font-family: var(--serif); font-size: 10px; font-weight: 500; letter-spacing: 0.18em; color: var(--ash); text-transform: uppercase; white-space: nowrap; }
.r-sec-sub { padding: 6px 22px 0; font-family: var(--voice); font-style: italic; font-size: 14px; color: rgba(244,239,230,0.55); line-height: 1.4; text-wrap: pretty; max-width: 330px; }

/* ── FILTER TABS ───────────────────────────────────────────────────────── */
.r-filters { position: relative; z-index: 6; flex-shrink: 0; display: flex; align-items: center; gap: 20px; overflow-x: auto; scrollbar-width: none;
  padding: 18px 22px 14px;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 18px, #000 calc(100% - 26px), transparent 100%);
          mask-image: linear-gradient(90deg, transparent 0, #000 18px, #000 calc(100% - 26px), transparent 100%); }
.r-filters::-webkit-scrollbar { display: none; }
.r-chip { flex-shrink: 0; padding-bottom: 7px; font-family: var(--serif); font-size: 11px; font-weight: 500; letter-spacing: 0.13em;
  color: var(--ash); text-transform: uppercase; white-space: nowrap; border-bottom: 1.5px solid transparent; transition: color 0.16s, border-color 0.16s;
  -webkit-tap-highlight-color: transparent; }
.r-chip:hover { color: var(--bone); }
.r-chip--on { color: var(--gold-bright); border-bottom-color: var(--gold); }
.r-chip-div { flex-shrink: 0; width: 1px; align-self: center; height: 14px; background: var(--hairline); }

/* ── FEATURED HERO ─────────────────────────────────────────────────────── */
.r-hero { position: relative; display: flex; gap: 16px; margin: 14px 22px 0; padding: 20px; border-radius: 18px;
  border: 1px solid var(--hairline); background: rgba(30,42,51,0.34); cursor: pointer; transition: border-color 0.18s, transform 0.18s; }
.r-hero:hover { border-color: var(--hairline-strong); transform: translateY(-1px); }
.r-hero.is-selected { border-color: var(--gold); box-shadow: 0 0 8px rgba(217,179,108,0.10); }
.r-hero-sigil { position: relative; flex-shrink: 0; width: 72px; height: 72px; border-radius: 50%;
  border: 1px solid rgba(217,179,108,0.25); background: radial-gradient(circle at 40% 34%, var(--harbor) 0%, var(--midnight) 76%);
  display: flex; align-items: center; justify-content: center; color: var(--gold); }
.r-hero-body { flex: 1; min-width: 0; }
.r-hero-badges { display: flex; gap: 14px; flex-wrap: wrap; }
.r-hero-name { font-family: var(--serif); font-size: 21px; font-weight: 600; color: var(--bone); letter-spacing: 0.02em; line-height: 1.1; margin-top: 10px; }
.r-hero-cat { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
.r-hero-desc { font-family: var(--voice); font-style: italic; font-size: 14.5px; color: rgba(244,239,230,0.58); line-height: 1.4; margin-top: 9px; text-wrap: pretty; }
.r-hero-foot { margin-top: 12px; display: flex; align-items: center; gap: 6px; font-family: var(--sans); font-size: 11px; color: var(--ash); }
.r-hero-foot svg { color: rgba(217,179,108,0.7); }
.r-check.r-check--hero { top: 14px; right: 14px; }

/* horizontal featured rail */
.r-rail { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; padding: 16px 22px 4px; scroll-snap-type: x mandatory; }
.r-rail::-webkit-scrollbar { display: none; }
.r-featcard { flex-shrink: 0; width: 148px; scroll-snap-align: start; position: relative; border-radius: 16px;
  border: 1px solid var(--hairline); background: rgba(30,42,51,0.24); padding: 14px; transition: border-color 0.18s, transform 0.18s; }
.r-featcard:hover { border-color: var(--hairline-strong); transform: translateY(-1px); }
.r-featcard.is-selected { border-color: var(--gold); box-shadow: 0 0 6px rgba(217,179,108,0.10); }
.r-featcard-glyph { width: 36px; height: 36px; border-radius: 50%; margin-bottom: 8px;
  border: 1px solid var(--slack); display: flex; align-items: center; justify-content: center; color: var(--ash); }
.r-featcard.is-selected .r-featcard-glyph, .r-featcard:hover .r-featcard-glyph { color: var(--gold); border-color: var(--hairline-strong); }
.r-featcard-name { font-family: var(--serif); font-size: 14px; font-weight: 600; color: var(--bone); letter-spacing: 0.02em; line-height: 1.15; }
.r-featcard-cat { font-family: var(--serif); font-size: 9px; font-weight: 500; letter-spacing: 0.16em; color: var(--ash); text-transform: uppercase; margin-top: 7px; }

/* ── STYLE CARD (core / recommended / seasonal / family grid) ─────────── */
.r-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px 22px 0; }
.r-card { position: relative; border-radius: 16px; border: 1px solid var(--hairline); background: rgba(30,42,51,0.2);
  padding: 16px; transition: border-color 0.18s, background 0.18s; min-height: 152px; display: flex; flex-direction: column; }
.r-card:hover { border-color: var(--hairline-strong); background: rgba(30,42,51,0.32); }
.r-card--reco { border-color: rgba(217,179,108,0.18); }
.r-card-glyph { width: 40px; height: 40px; border-radius: 50%; margin-bottom: 8px;
  border: 1px solid var(--slack); display: flex; align-items: center; justify-content: center; color: var(--ash); transition: all 0.18s; }
.r-card:hover .r-card-glyph { color: var(--gold); border-color: var(--hairline-strong); }
.r-sample-tag { font-family: var(--sans); font-size: 8px; font-weight: 500; letter-spacing: 0.12em; color: rgba(135,147,157,0.5); text-transform: uppercase; margin-bottom: 10px; }
.r-card-name { font-family: var(--serif); font-size: 15px; font-weight: 600; color: var(--bone); letter-spacing: 0.02em; line-height: 1.15; }
.r-card-cat { font-family: var(--serif); font-size: 9px; font-weight: 500; letter-spacing: 0.16em; color: var(--ash); text-transform: uppercase; margin-top: 7px; }
.r-card-tags { font-family: var(--sans); font-size: 10.5px; font-weight: 400; letter-spacing: 0.02em; color: rgba(217,179,108,0.75); margin-top: 7px; }
.r-card-desc { font-family: var(--voice); font-style: italic; font-size: 13px; color: rgba(244,239,230,0.5); line-height: 1.32; margin-top: 6px; text-wrap: pretty; }
.r-card-badge-slot { margin-top: auto; padding-top: 12px; }

/* selected state — thin gold ring, no heavy glow */
.r-card.is-selected { border-color: var(--gold); box-shadow: 0 0 6px rgba(217,179,108,0.10); background: rgba(30,42,51,0.36); }
.r-card.is-selected .r-card-glyph { color: var(--gold); border-color: var(--hairline-strong); }
.r-check { position: absolute; top: 12px; right: 12px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--gold); display: flex; align-items: center; justify-content: center; color: var(--midnight);
  box-shadow: 0 0 8px rgba(217,179,108,0.45); }
.r-check svg { width: 9px; height: 9px; }

/* ── BADGES ── dot + tracked label, no pill chrome ─────────────────────── */
.r-badge { display: inline-flex; align-items: center; gap: 6px; font-family: var(--sans); font-size: 10px;
  font-weight: 500; letter-spacing: 0.10em; text-transform: uppercase; white-space: nowrap; }
.r-badge-dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.r-badge--gold, .r-badge--seasonal { color: var(--gold); }
.r-badge--new { color: rgba(244,239,230,0.62); }
.r-badge--limited { color: var(--gold); }
.r-badge--limited .r-badge-dot { animation: r-pulse 2.4s ease-in-out infinite; }
.r-badge--core { color: var(--ash); }

/* ── SEASONAL SUB-HEADER ───────────────────────────────────────────────── */
.r-seasonal-hd { display: flex; align-items: center; gap: 10px; margin: 16px 22px 0; }
.r-seasonal-glyph { width: 24px; height: 24px; flex-shrink: 0; color: var(--gold); display: flex; align-items: center; justify-content: center; }
.r-seasonal-name { font-family: var(--serif); font-size: 12.5px; font-weight: 600; letter-spacing: 0.06em; color: var(--bone); }
.r-seasonal-note { font-family: var(--voice); font-style: italic; font-size: 12.5px; color: var(--ash); margin-top: 1px; }

/* empty filter state */
.r-empty { padding: 56px 22px; }
.r-empty-title { font-family: var(--serif); font-size: 16px; font-weight: 600; color: var(--bone); letter-spacing: 0.03em; }
.r-empty-sub { font-family: var(--voice); font-style: italic; font-size: 14.5px; color: rgba(244,239,230,0.5); margin-top: 8px; }

/* flat filtered grid header */
.r-flat-hd { padding: 4px 22px 0; }
.r-flat-title { font-family: var(--serif); font-size: 17px; font-weight: 600; color: var(--bone); letter-spacing: 0.04em; }
.r-flat-title span { color: var(--gold); }
.r-flat-sub { font-family: var(--serif); font-size: 10px; font-weight: 500; letter-spacing: 0.16em; color: var(--ash); text-transform: uppercase; margin-top: 7px; }

/* ── EXPLORE MORE — tab row + family filters ──────────────────────────── */
.r-explore-tabs { display: flex; gap: 20px; overflow-x: auto; scrollbar-width: none; padding: 16px 22px 0; }
.r-explore-tabs::-webkit-scrollbar { display: none; }
.r-explore-panel { margin-top: 6px; }
.r-family-filters { display: flex; gap: 16px; overflow-x: auto; scrollbar-width: none; padding: 2px 22px 0; }
.r-family-filters::-webkit-scrollbar { display: none; }

/* ── YOUR STRUCTURE HERO ───────────────────────────────────────────────── */
.r-struct-hero { margin: 26px 22px 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
.r-struct-hero-label { font-family: var(--serif); font-size: 10.5px; font-weight: 600; letter-spacing: 0.18em; color: var(--ash); text-transform: uppercase; }
.r-struct-hero-glyph { width: 148px; height: 148px; flex-shrink: 0; border-radius: 50%; margin-top: 16px; display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(217,179,108,0.22); background: radial-gradient(circle at 42% 36%, var(--harbor) 0%, var(--midnight) 78%); color: var(--gold); }
.r-struct-hero-name { margin-top: 14px; font-family: var(--serif); font-size: 12px; font-weight: 600; letter-spacing: 0.16em; color: var(--gold-bright); text-transform: uppercase; }
.r-struct-hero-def { margin-top: 6px; font-family: var(--voice); font-style: italic; font-size: 13px; color: rgba(244,239,230,0.55); max-width: 260px; }
.r-struct-lock { margin-top: 16px; display: flex; align-items: center; gap: 6px; font-family: var(--serif); font-size: 10.5px; font-weight: 600; letter-spacing: 0.12em; color: var(--gold); text-transform: uppercase; }
.r-struct-lock-sub { margin-top: 4px; font-family: var(--sans); font-weight: 300; font-size: 11.5px; color: var(--ash); }

/* ── FIRST-USE MICROTEACHING ───────────────────────────────────────────── */
.r-teach { margin: 0 22px; max-height: 0; opacity: 0; overflow: hidden; transition: max-height 0.4s ease, opacity 0.4s ease, margin-top 0.4s ease; text-align: center; }
.r-teach.is-visible { max-height: 70px; opacity: 1; margin-top: 20px; }
.r-teach-line1 { font-family: var(--serif); font-size: 13px; font-weight: 600; color: var(--gold-bright); letter-spacing: 0.02em; }
.r-teach-line2 { font-family: var(--sans); font-size: 11.5px; color: var(--ash); margin-top: 4px; }
@media (prefers-reduced-motion: reduce) { .r-teach { transition: opacity 0.2s ease; } }

/* ── STICKY BOTTOM CTA ─────────────────────────────────────────────────── */
.r-cta-bar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 8; padding: 40px 22px 34px;
  background: linear-gradient(180deg, rgba(15,20,25,0) 0%, var(--navy) 46%); pointer-events: none; }
.r-cta-selected { pointer-events: auto; display: flex; align-items: baseline; justify-content: center; gap: 8px; margin-bottom: 12px;
  font-family: var(--sans); font-size: 11px; letter-spacing: 0.08em; color: var(--ash); text-transform: uppercase; }
.r-cta-selected b { font-family: var(--serif); font-weight: 600; font-size: 13px; letter-spacing: 0.03em; color: var(--gold-bright); text-transform: none; }
.r-cta-swatch { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 6px rgba(217,179,108,0.55); flex-shrink: 0; }
.r-cta-btn { pointer-events: auto; width: 100%; height: 54px; border-radius: 999px; background: rgba(217,179,108,0.10);
  border: 1px solid rgba(217,179,108,0.34); color: var(--gold-bright); font-family: var(--serif); font-size: 14px; font-weight: 600;
  letter-spacing: 0.16em; text-transform: uppercase; display: flex; align-items: center; justify-content: center; transition: background 0.16s; }
.r-cta-btn:hover { background: rgba(217,179,108,0.16); }

/* ── GENERATION TRANSITION OVERLAY ────────────────────────────────────── */
.r-gen-overlay { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  background: rgba(11,16,21,0.94); opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
.r-gen-overlay.is-visible { opacity: 1; pointer-events: auto; }
.r-gen-combo { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 15px; font-weight: 600; letter-spacing: 0.08em; color: var(--gold-bright); text-transform: uppercase; }
.r-gen-sep { color: var(--hairline-strong); }
.r-gen-arrow { color: var(--hairline-strong); font-size: 16px; }
.r-gen-creating { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 12px; font-weight: 500; letter-spacing: 0.16em; color: var(--ash); text-transform: uppercase; }
.r-gen-ring { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--hairline-strong); border-top-color: var(--gold); animation: r-spin 900ms linear infinite; }
@keyframes r-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .r-gen-ring { animation: none; } .r-gen-overlay { transition: none; } }
</style>
